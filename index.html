<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后续章节预约</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .btn {
            display: block;
            background-color: #007AFF;
            color: white;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.2);
            transition: all 0.2s ease;
        }
        .btn:active {
            background-color: #0056b3;
            transform: scale(0.98);
        } 
        /* 按钮禁用后的样式 */
        .btn:disabled {
            background-color: #28a745; /* 绿色表示成功 */
            cursor: default;
            box-shadow: none;
        }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #28a745;
            height: 20px;
            font-weight: 500;
        }
        /* 隐藏用于兼容性复制的文本框 */
        #copy-area {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 标题 -->
        <h1>点击查看后续章节并预约更新</h1>
        
        <!-- 隐藏的 textarea，用于兼容旧版浏览器 -->
        <textarea id="copy-area"></textarea>

        <!-- 按钮 -->
        <button class="btn" id="actionBtn" onclick="copyAddress()">
            点击查看后续章节并预约更新
        </button>

        <div class="status" id="msg"></div>
    </div>

    <script>
        // ⚠️ 重要：请在这里修改为你的 USDT 地址
        const MY_WALLET_ADDRESS = "TD7612XqoMXpyr7ZjmJDLBNCpMoZ6cjfTB";
        
        // ⚠️ 跳转链接
        const TELEGRAM_LINK = "https://t.me/xiaoshuolele001"; 

        function copyAddress() {
            const msg = document.getElementById('msg');
            const btn = document.getElementById('actionBtn');
            const copyArea = document.getElementById('copy-area');
            
            // 1. 将地址填入隐藏的 textarea
            copyArea.value = MY_WALLET_ADDRESS;
            copyArea.select();
            copyArea.setSelectionRange(0, 99999); 

            try {
                // 2. 执行系统复制命令
                document.execCommand("copy");
                
                // 3. 改变按钮状态和文字
                btn.textContent = "预约成功！正在跳转...";
                btn.disabled = true; // 禁用按钮防止重复点击
                
                // 4. 延迟 1 秒后跳转
                setTimeout(() => {
                    window.location.href = TELEGRAM_LINK;
                }, 1000);

            } catch (err) {
                msg.textContent = "❌ 复制失败，请长按选择复制";
                console.error('Copy failed:', err);
            }
        }
    </script>

</body>
</html>
